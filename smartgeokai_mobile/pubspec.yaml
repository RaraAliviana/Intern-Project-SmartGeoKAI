name: smartgeokai_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # HTTP Client & Storage
  dio: ^5.7.0
  http: ^1.2.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # State Management
  provider: ^6.1.2

  # Media & Location
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  image: ^4.2.0

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UI & Icons
  google_fonts: ^6.1.0
  iconsax_flutter: ^1.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/